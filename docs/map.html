const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const groups = {}, all = [];
data.features.forEach(f => {
  const d = f.properties.day; groups[d] = groups[d] || L.layerGroup().addTo(map);
  if (f.geometry.type === 'LineString') {
    L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]),{color:f.properties.stroke,weight:3,opacity:.8,dashArray:'6 6'}).addTo(groups[d]);
    groups[d].title = f.properties.title; groups[d].color = f.properties.stroke;
  } else {
    const [lo,la] = f.geometry.coordinates; all.push([la,lo]);
    const n = f.properties.title.split(' ')[1];
    const icon = L.divIcon({className:'',html:`<div class="pin" style="background:${f.properties['marker-color']}">${n}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    L.marker([la,lo],{icon}).bindPopup(`<b>${f.properties.title}</b><br>${f.properties.description}`).addTo(groups[d]);
  }
});
const box = document.getElementById('days');
Object.keys(groups).forEach(d => {
  const g = groups[d], l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${g.color}"></span>${g.title}`;
  l.querySelector('input').onchange = e => e.target.checked ? g.addTo(map) : map.removeLayer(g);
  box.appendChild(l);
});
map.fitBounds(all,{padding:[40,40]});
